<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 340" role="img" aria-labelledby="lazo-title lazo-desc">
  <title id="lazo-title">Arquitectura sistémica de un lazo de control digital</title>
  <desc id="lazo-desc">Diagrama de bloques con dominio digital (referencia r[k], sumador, controlador digital u[k]), interfaz DAC con retenedor ZOH, dominio continuo (actuador, planta física y(t), sensor, filtro antialiasing) e interfaz ADC con muestreador S/H que cierra el lazo con y[k].</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="8.5" refY="5" markerWidth="6.5" markerHeight="6.5" orient="auto-start-reverse">
      <path d="M 0 1.5 L 9 5 L 0 8.5 z" fill="#003087" />
    </marker>
  </defs>

  <!-- Fondo de zonas: Dominio Digital vs. Dominio Continuo -->
  <rect x="16" y="18" width="405" height="304" rx="14" fill="#EFF6FF" stroke="#003087" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="34" y="42" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#003087">DOMINIO DIGITAL (discreto en t y amplitud)</text>

  <rect x="442" y="18" width="462" height="304" rx="14" fill="#F8FAFC" stroke="#64748B" stroke-width="1.5" stroke-dasharray="6 4" />
  <text x="460" y="42" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#334155">DOMINIO CONTINUO (mundo físico analógico)</text>

  <!-- Referencia r[k] -->
  <text x="28" y="114" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="600" fill="#0F172A">r[k]</text>
  <line x1="56" y1="110" x2="98" y2="110" stroke="#003087" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Sumador -->
  <circle cx="118" cy="110" r="18" fill="#FFFFFF" stroke="#003087" stroke-width="2.2" />
  <text x="118" y="115" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="16" font-weight="700" fill="#003087">Σ</text>
  <text x="95" y="101" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#003087">+</text>
  <text x="125" y="141" font-family="Inter, system-ui, sans-serif" font-size="14" font-weight="700" fill="#DC2626">−</text>

  <!-- Error e[k] -->
  <line x1="136" y1="110" x2="188" y2="110" stroke="#003087" stroke-width="2" marker-end="url(#arrow)" />
  <text x="162" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">e[k]</text>

  <!-- Controlador Digital -->
  <rect x="192" y="78" width="142" height="64" rx="10" fill="#003087" />
  <text x="263" y="105" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Controlador</text>
  <text x="263" y="123" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" fill="#DBEAFE">MCU / DSP / FPGA</text>

  <!-- u[k] -->
  <line x1="334" y1="110" x2="390" y2="110" stroke="#003087" stroke-width="2" marker-end="url(#arrow)" />
  <text x="362" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">u[k]</text>

  <!-- DAC + ZOH (frontera superior) -->
  <rect x="394" y="78" width="108" height="64" rx="10" fill="#D97706" />
  <text x="448" y="105" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">DAC + ZOH</text>
  <text x="448" y="123" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#FEF3C7">Retención T</text>

  <!-- u(t) -->
  <line x1="502" y1="110" x2="548" y2="110" stroke="#003087" stroke-width="2" marker-end="url(#arrow)" />
  <text x="525" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">u(t)</text>

  <!-- Actuador -->
  <rect x="552" y="82" width="102" height="56" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
  <text x="603" y="108" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0F172A">Actuador</text>
  <text x="603" y="124" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#475569">Válvula / PWM</text>

  <line x1="654" y1="110" x2="688" y2="110" stroke="#003087" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Planta -->
  <rect x="692" y="78" width="136" height="64" rx="10" fill="#0F172A" />
  <text x="760" y="105" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">Planta Física</text>
  <text x="760" y="123" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#CBD5E1">Proceso continuo</text>

  <!-- Salida y(t) -->
  <line x1="828" y1="110" x2="892" y2="110" stroke="#003087" stroke-width="2" marker-end="url(#arrow)" />
  <text x="866" y="100" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0F172A">y(t)</text>

  <!-- Retroalimentación hacia Sensor -->
  <circle cx="854" cy="110" r="4" fill="#003087" />
  <polyline points="854,110 854,248 796,248" fill="none" stroke="#003087" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Sensor / Transductor -->
  <rect x="678" y="220" width="114" height="56" rx="10" fill="#FFFFFF" stroke="#0284C7" stroke-width="2" />
  <text x="735" y="246" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12.5" font-weight="700" fill="#0F172A">Sensor</text>
  <text x="735" y="262" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#475569">Transductor</text>

  <line x1="678" y1="248" x2="646" y2="248" stroke="#003087" stroke-width="2" marker-end="url(#arrow)" />

  <!-- Filtro Antialiasing -->
  <rect x="526" y="220" width="116" height="56" rx="10" fill="#FFFFFF" stroke="#0D9488" stroke-width="2" />
  <text x="584" y="245" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="700" fill="#0F172A">Filtro</text>
  <text x="584" y="261" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="10.5" fill="#0F766E">Antialiasing</text>

  <line x1="526" y1="248" x2="496" y2="248" stroke="#003087" stroke-width="2" marker-end="url(#arrow)" />

  <!-- ADC + S/H (frontera inferior) -->
  <rect x="378" y="216" width="114" height="64" rx="10" fill="#0D9488" />
  <text x="435" y="243" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="13" font-weight="700" fill="#FFFFFF">ADC + S/H</text>
  <text x="435" y="261" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11" fill="#CCFBF1">T y n bits</text>

  <!-- Retorno y[k] al sumador -->
  <polyline points="378,248 118,248 118,132" fill="none" stroke="#003087" stroke-width="2" marker-end="url(#arrow)" />
  <text x="248" y="238" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600" fill="#0F172A">y[k] (secuencia binaria)</text>

  <!-- Reloj maestro -->
  <rect x="206" y="168" width="114" height="32" rx="8" fill="#FEF3C7" stroke="#D97706" stroke-width="1.5" />
  <text x="263" y="188" text-anchor="middle" font-family="Inter, system-ui, sans-serif" font-size="11.5" font-weight="700" fill="#92400E">Reloj maestro (T)</text>
  <line x1="263" y1="168" x2="263" y2="144" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3 3" />
  <polyline points="320,184 448,184 448,144" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3 3" />
  <polyline points="320,184 435,184 435,214" fill="none" stroke="#D97706" stroke-width="1.5" stroke-dasharray="3 3" />
</svg>
